<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Отметка</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body class="bg-light">
    <div class="container mt-5 text-center">
        <div class="card shadow mx-auto" style="max-width: 400px;">
            <div class="card-body">
                <h2>Отметка</h2>
                <p class="lead">Пара №{{ pair_num }}</p>
                <p>Нажмите кнопку, чтобы подтвердить присутствие.</p>

                <form action="/mark" method="POST">
                    <input type="hidden" name="pair_num" value="{{ pair_num }}">
                    <button type="submit" class="btn btn-success btn-lg w-100 mt-3">Я здесь!</button>
                </form>

                <a href="/" class="btn btn-outline-secondary w-100 mt-3">Отмена</a>
            </div>
        </div>
    </div>
</body>
</html>
