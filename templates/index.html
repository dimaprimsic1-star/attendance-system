<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Личный кабинет</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5 text-center">
        <h1>Привет, {{ fio }}!</h1>
        <p class="lead">Твоя роль: {{ role }}</p>

        {% if role == 'student' %}
            <div class="card mt-4 mx-auto" style="max-width: 400px;">
                <div class="card-body">
                    <h3>Отметка на паре</h3>
                    <p>Нажми кнопку, чтобы подтвердить, что ты пришел.</p>
                    <form action="/mark" method="POST">
                        <button type="submit" class="btn btn-success btn-lg w-100">Я здесь!</button>
                    </form>
                </div>
            </div>
        {% else %}
            <div class="alert alert-info mt-4">Вы вошли как {{ role }}. Здесь будет панель управления.</div>
        {% endif %}

        <a href="/" class="btn btn-outline-secondary mt-4">Обновить</a>
    </div>
</body>
</html>
