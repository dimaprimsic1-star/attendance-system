<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Панель старосты</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .qr-container { display: none; text-align: center; margin-top: 20px; }
        .qr-container img { max-width: 300px; width: 100%; }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center">
            <h1>Панель старосты</h1>
            <a href="/logout" class="btn btn-danger">Выйти</a>
        </div>

        <div class="text-center mb-4 mt-3">
            <button class="btn btn-primary me-2" onclick="showQR(1)">QR для 1 пары</button>
            <button class="btn btn-primary me-2" onclick="showQR(2)">QR для 2 пары</button>
            <button class="btn btn-primary me-2" onclick="showQR(3)">QR для 3 пары</button>
            <button class="btn btn-primary" onclick="showQR(4)">QR для 4 пары</button>
        </div>

        <div class="qr-container" id="qr-box">
            <h3>Отсканируйте код телефоном</h3>
            <img id="qr-image" src="" alt="QR Code">
            <p class="mt-2 text-muted">Код обновляется каждые 25 секунд</p>
        </div>

        <div class="card shadow mt-4">
            <div class="card-body">
                <table class="table table-bordered table-hover text-center">
                    <thead class="table-dark">
                        <tr>
                            <th>ФИО</th>
                            <th>1 пара</th>
                            <th>2 пара</th>
                            <th>3 пара</th>
                            <th>4 пара</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for s in students %}
                        <tr>
                            <td class="text-start">{{ s['fio'] }}</td>
                            {% for pair in [1, 2, 3, 4] %}
                            <td>
                                {% if s['id'] in stats and pair in stats[s['id']] %}
                                    <span class="text-success fs-4">✔</span>
                                {% else %}
                                    <span class="text-muted">—</span>
                                {% endif %}
                            </td>
                            {% endfor %}
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let currentPair = null;
        let timer = null;

        function showQR(pair) {
            currentPair = pair;
            document.getElementById('qr-box').style.display = 'block';
            updateQR();

            if (timer) clearInterval(timer);
            timer = setInterval(updateQR, 25000);
        }

        function updateQR() {
            if (!currentPair) return;
            document.getElementById('qr-image').src = `/qr/${currentPair}?t=${new Date().getTime()}`;
        }
    </script>
</body>
</html>
